plugins {
    id 'java'
}

group = 'io.github.lengors'

String javaVersion = properties["javaVersion"] ?: "25"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}
