import java.util.stream.Collectors

plugins {
  id "java"
  id "jacoco"
  id "checkstyle"
  id "org.sonarqube"
  id "org.checkerframework"
  id "org.springframework.boot"
  id "io.spring.dependency-management"
}

group = "io.github.lengors"

String javaVersion = properties["javaVersion"] ?: "25"
String wireMockTestcontainersVersion = properties["wireMockTestcontainersVersion"] ?: "1.0-alpha-15"
String checkerframeworkVersion = properties["checkerframeworkVersion"] ?: "4.2.0"
String checkstyleToolVersion = properties["checkstyleToolVersion"] ?: "10.23.1"

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
  mavenLocal()
}

dependencies {
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-opentelemetry"
  implementation "org.springframework.boot:spring-boot-starter-restclient"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-webmvc"
  compileOnly "org.springframework.boot:spring-boot-docker-compose"
  developmentOnly "org.springframework.boot:spring-boot-devtools"
  developmentOnly "org.springframework.boot:spring-boot-docker-compose"
  runtimeOnly "io.micrometer:micrometer-registry-prometheus"
  annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
  testImplementation "org.springframework.boot:spring-boot-starter-actuator-test"
  testImplementation "org.springframework.boot:spring-boot-starter-opentelemetry-test"
  testImplementation "org.springframework.boot:spring-boot-starter-restclient-test"
  testImplementation "org.springframework.boot:spring-boot-starter-validation-test"
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation "org.springframework.boot:spring-boot-testcontainers"
  testImplementation "org.wiremock.integrations.testcontainers:wiremock-testcontainers-module:$wireMockTestcontainersVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

checkerFramework {
  version = checkerframeworkVersion
  checkers = [
    "org.checkerframework.checker.nullness.NullnessChecker",
  ]
}

test {
  useJUnitPlatform()
}

tasks.register("setVersion") {
  doLast {
    String newVersion = findProperty("newVersion")
    if (newVersion == null) throw new IllegalAccessException("newVersion not set")
    def propertiesFile = file("gradle.properties")
    def version = "^\\s*version\\s*=\\s*(.*?)\\s*\$"
    def text = propertiesFile
      .readLines()
      .stream()
      .map { line ->
        line.replaceAll(version) { matcher ->
          if (matcher.size() < 2) throw new IllegalStateException("$line does not match $version")
          String matchedLine = matcher[0]
          String matchedVersion = matcher[1]
          matchedLine.replace(matchedVersion, newVersion)
        }
      }
      .collect(Collectors.joining(System.lineSeparator()))
    propertiesFile.write(text)
  }
}

checkstyle {
  toolVersion = checkstyleToolVersion
}

jacocoTestReport {
  dependsOn test

  reports {
    xml.required = true
  }
}

sonar {
  properties {
    property("sonar.projectKey", "lengors_${project.name}")
    property("sonar.organization", "lengors-github")
    property("sonar.host.url", "https://sonarcloud.io")
  }
}
