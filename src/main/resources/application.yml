---
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: janus
  docker:
    compose:
      enabled: false
  threads:
    virtual:
      enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.0}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

authentik:
  client:
    url: ${AUTHENTIK_CLIENT_URL:http://localhost:9000}
    service-account-token: ${AUTHENTIK_CLIENT_SERVICE_ACCOUNT_TOKEN:}